<meta charset="UTF-8">
<title>古文助動詞クイズ</title>

  .question-text {

    background: linear-gradient(135deg, #f093fb, #f5576c);

  .choice-button {

    border: none; border-radius: 16px; padding: 1rem;

  }
  .choice-button:disabled { background: #e2e8f0; cursor: not-allowed; }

  .timer-bar {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 100%; border-radius: 16px;
    background: linear-gradient(90deg, #f8bbd9, #f48fb1);
    transition: width 0.1s linear;
    box-shadow: 0 2px 8px rgba(244,143,177,0.3);

  .timer-bar.critical {
    background: linear-gradient(90deg, #f48fb1, #ec407a);
    animation: gentlePulse 1s ease-in-out infinite;
  }
  @keyframes gentlePulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.85; }
  }
  .timer-bar-gloss {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.28) 0%, transparent 50%);
    border-radius: 18px; pointer-events: none;
  }
  .timer-text {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 0.95rem;
    color: #1a1a2e; text-shadow: 0 1px 2px rgba(255,255,255,0.5);
    z-index: 5;
  }
  .timer-text.light { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }

  .feedback {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%); z-index: 1000;
    font-size: 1.6rem; font-weight: 700; padding: 1.8rem 2.5rem;
    border-radius: 22px; box-shadow: 0 18px 36px rgba(0,0,0,0.25);
    min-width: 280px; text-align: center; display: none;

  @keyframes fbBounce {
    0% { transform: translate(-50%,-50%) scale(0.8); opacity: 0; }
    60% { transform: translate(-50%,-50%) scale(1.08); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(1); }
  }

  .feedback.incorrect { background: linear-gradient(135deg, #ffecd2, #fcb69f); color: #c53030; }
  .feedback.timeout { background: linear-gradient(135deg, #ffeaa7, #fdcb6e); color: #b7791f; }

  .stat-number { font-size: 2.2rem; font-weight: 700; }
  .stat-label { font-size: 0.9rem; color: #666; }

  .result-msg { font-size: 1.3rem; font-weight: 600; padding: 1.2rem; border-radius: 18px; margin: 1rem 0; }

  .result-msg.poor { background: linear-gradient(135deg, #ff9a9e, #fecfef); color: #c53030; }

  .btn-main {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff; border: none; padding: 0.9rem 1.8rem;

  .diff-btn.expert { background: linear-gradient(135deg, #f3d9ff, #d6b8ff); }
  .diff-btn.selected { box-shadow: 0 0 0 3px #667eea; }
</style>

let quizList=[], remaining=[], score=0, total=0, timeLimit=10;
let timerId=null, startTime=null, isProcessing=false;

const $ = id => document.getElementById(id);

function parseCSV() {
  quizList = CSV.split('\n').map(line => {
    const c = line.split(',');
    if (c.length < 6) return null;
    const q = c[0], ans = c[1], opts = c.slice(2,6).filter(x=>x);
    if (!opts.includes(ans)) opts.push(ans);
    return { question: q, answer: ans, choices: opts };
  }).filter(Boolean);
}

function shuffle(a) { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

function showQuestion() {
  isProcessing = false;
  stopTimer();
  $('feedback').className = 'feedback';
  $('feedback').style.display = 'none';

  if (!remaining.length) { showResult(); return; }

  const idx = Math.floor(Math.random() * remaining.length);
  const q = remaining.splice(idx, 1)[0];
  total++;

  $('questionTitle').textContent = `📚 問題`;
  $('questionNumber').textContent = `第 ${total} 問 / 全 ${quizList.length} 問`;
  $('questionText').textContent = q.question;

  const choicesDiv = $('choices');
  choicesDiv.innerHTML = '';
  shuffle([...q.choices]).forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choice-button';
    btn.textContent = ch;
    btn.onclick = () => checkAnswer(q, ch);
    choicesDiv.appendChild(btn);
  });

  startTimer();
}

function checkAnswer(q, sel) {
  if (isProcessing) return;
  isProcessing = true;
  stopTimer();
  document.querySelectorAll('.choice-button').forEach(b => b.disabled = true);

  const fb = $('feedback');
  if (sel === q.answer) {
    score++;
    fb.textContent = '🎉 正解！';
    fb.className = 'feedback correct show';
  } else {
    fb.textContent = `❌ 残念… 正解は「${q.answer}」`;
    fb.className = 'feedback incorrect show';
  }
  fb.style.display = 'block';  // この行を追加
  
  setTimeout(() => { 
    fb.className = 'feedback'; 
    fb.style.display = 'none'; 
    showQuestion(); 
  }, 1800);
}

function handleTimeout() {
  if (isProcessing) return;
  isProcessing = true;
  stopTimer();
  document.querySelectorAll('.choice-button').forEach(b => b.disabled = true);

  const currentQ = quizList.find(q => $('questionText').textContent === q.question);
  const fb = $('feedback');
  fb.textContent = `⏰ 時間切れ… 正解は「${currentQ?.answer || ''}」`;
  fb.className = 'feedback timeout show';
  fb.style.display = 'block';  // この行を追加
  
  setTimeout(() => { 
    fb.className = 'feedback'; 
    fb.style.display = 'none'; 
    showQuestion(); 
  }, 1800);
}

function startTimer() {
  startTime = Date.now();
  updateTimerBar();
}

function updateTimerBar() {
  if (isProcessing) return;
  const elapsed = (Date.now() - startTime) / 1000;
  const remain = Math.max(0, timeLimit - elapsed);
  const pct = (remain / timeLimit) * 100;

  const bar = $('timerBar');
  const txt = $('timerText');
  bar.style.width = pct + '%';

  if (pct <= 25) {
    bar.classList.add('critical');
    txt.classList.add('light');
  } else {
    bar.classList.remove('critical');
    txt.classList.remove('light');
  }

  txt.textContent = remain < 1 ? remain.toFixed(1) + ' 秒' : Math.ceil(remain) + ' 秒';

  if (remain <= 0) { handleTimeout(); return; }
  timerId = requestAnimationFrame(updateTimerBar);
}

function stopTimer() { if (timerId) { cancelAnimationFrame(timerId); timerId = null; } }

function showResult() {
  $('quiz').style.display = 'none';
  $('result').style.display = 'block';
  const pct = total ? (score / total * 100) : 0;
  let msgClass = 'poor', msgText = '📚 もう少し頑張りましょう！';
  if (pct >= 80) { msgClass = 'excellent'; msgText = '🌟 素晴らしい！達人級です！'; }
  else if (pct >= 50) { msgClass = 'good'; msgText = '👍 良い調子！もう少しで完璧！'; }

  $('resultContent').innerHTML = `
    <div class="stat-row">
      <div class="stat-card"><div class="stat-number">${total}</div><div class="stat-label">出題数</div></div>
      <div class="stat-card"><div class="stat-number">${score}</div><div class="stat-label">正解数</div></div>
      <div class="stat-card"><div class="stat-number">${pct.toFixed(0)}%</div><div class="stat-label">正答率</div></div>
    </div>
    <div class="gauge-wrap"><div class="gauge-bar" id="gauge"></div></div>
    <div class="result-msg ${msgClass}">${msgText}</div>`;
  setTimeout(() => { $('gauge').style.width = pct + '%'; }, 300);
}

window.onload = function() {
  parseCSV();
  $('start').style.display = 'block';

  document.querySelectorAll('.diff-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      timeLimit = parseInt(btn.dataset.time);
    };
  });

  $('startBtn').onclick = () => {
    $('start').style.display = 'none';
    $('quiz').style.display = 'block';
    remaining = [...quizList];
    score = 0; total = 0;
    showQuestion();
  };
};
